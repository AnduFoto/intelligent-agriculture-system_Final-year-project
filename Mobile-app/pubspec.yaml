name: massaye
description: "Massaye - Intelligent Agriculture System Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & JWT Authentication
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0

  # Media & Hardware Integration
  image_picker: ^1.0.7
  camera: ^0.10.5
  record: ^5.1.2
  audioplayers: ^5.2.1
  video_player: ^2.8.2
  chewie: ^1.7.5
  cached_network_image: ^3.3.1

  # Routing & Navigation
  go_router: ^13.1.0

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_web: 1.3.0
  record_platform_interface: 1.6.0
  record_linux: 0.7.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/translations/en.json
    - assets/translations/am.json
    - assets/images/
